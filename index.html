<script>
/* 捲動深度 + 外連點擊追蹤 */
(function(){
  var hit={};
  addEventListener('scroll',function(){
    var h=document.documentElement;
    var p=(h.scrollTop+innerHeight)/h.scrollHeight*100;
    [25,50,75,100].forEach(function(m){
      if(p>=m&&!hit[m]){hit[m]=1; if(window.gtag)gtag('event','scroll_depth',{percent:m});}
    });
  },{passive:true});
  addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="http"]');
    if(!a||a.host===location.host)return;
    if(window.gtag)gtag('event','outbound_click',{link_url:a.href,link_domain:a.host});
    try{
      var u=new URL(a.href);
      if(!u.searchParams.get('utm_source')){
        u.searchParams.set('utm_source','pts-word-practice');
        u.searchParams.set('utm_medium','referral');
        a.href=u.toString();
      }
    }catch(_){}
  },true);
})();
