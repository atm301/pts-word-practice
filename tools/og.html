<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<title>OG 1200x630</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#e4eaf7;
  background:radial-gradient(900px 520px at 50% -10%,rgba(56,189,248,.32),transparent 62%),
             radial-gradient(620px 400px at 92% 12%,rgba(251,191,36,.16),transparent 60%),#050915;
  position:relative;padding:58px 64px;display:flex;flex-direction:column;justify-content:center}
.kai{font-family:"DFKai-SB","BiauKai","Kaiti TC","PMingLiU",serif}
.grid{position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(56,189,248,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(56,189,248,.09) 1px,transparent 1px);
  background-size:60px 60px}
.tag{display:inline-flex;align-items:center;gap:10px;font-size:20px;color:#7dd3fc;letter-spacing:.24em;margin-bottom:18px}
.tag i{width:44px;height:2px;background:#38bdf8;display:block}
h1{font-size:96px;letter-spacing:.1em;line-height:1.06;margin-bottom:14px}
h1 b{background:linear-gradient(100deg,#38bdf8,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:29px;color:#b9c6e0;margin-bottom:34px;letter-spacing:.02em}
.units{display:flex;gap:14px}
.u{flex:1;background:rgba(148,178,255,.07);border:1px solid rgba(148,178,255,.22);
   border-radius:16px;padding:20px 18px}
.u em{display:block;font-style:normal;font-size:27px;letter-spacing:.09em;margin-bottom:8px}
.u span{font-size:18px;color:#8b9cbd}
.u s{display:inline-block;text-decoration:none;color:#fb7185;font-size:17px;font-weight:700}
.by{position:absolute;right:64px;bottom:40px;font-size:20px;color:#8b9cbd;letter-spacing:.04em}
.pen{position:absolute;left:64px;bottom:40px;font-size:20px;color:#fbbf24}
</style></head>
<body>
<div class="grid"></div>
<div class="tag"><i></i>給行銷人與廣告人的手寫國文特訓</div>
<h1 class="kai">一字千金 <b>練習場</b></h1>
<p class="sub">四大單元 · 節目真實秒數 · 平板觸控筆手寫作答 · 附行銷解讀</p>
<div class="units">
  <div class="u"><em class="kai">畫中有話</em><span>圖形寫成語 <s>30″</s></span></div>
  <div class="u"><em class="kai">拾字路口</em><span>兩句三字詞 <s>30″</s></span></div>
  <div class="u"><em class="kai">字字珠璣</em><span>一字通四詞 <s>30″</s></span></div>
  <div class="u"><em class="kai">洞築機先</em><span>三關寫成語 <s>40-60″</s></span></div>
</div>
<div class="pen">✍ atm301.github.io/pts-word-practice</div>
<div class="by">圭話行銷 ATMarketing</div>
</body></html>
